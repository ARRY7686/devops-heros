apiVersion: v1
kind: Pod
metadata:
  name: fail-1-crashloop-pod
  labels:
    tier: triage-gauntlet
    scenario: crashloop
spec:
  containers:
    - name: python-app
      image: python:3.11-alpine
      env:
        # FIX: the app requires DATABASE_URL at startup
        - name: DATABASE_URL
          value: "postgres://app:app@postgres-db:5432/appdb"
      command:
        - "python3"
        - "-c"
        - |
          import os, sys, time
          db_url = os.environ.get("DATABASE_URL")
          if not db_url:
              print("[FATAL ERROR]: DATABASE_URL environment variable is MISSING!", file=sys.stderr)
              sys.exit(1)
          print("Application started successfully!", flush=True)
          # FIX: a long-running service must not exit (restartPolicy: Always would restart it)
          while True:
              time.sleep(60)
