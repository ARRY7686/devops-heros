apiVersion: v1
kind: Pod
metadata:
  name: cc-demo
  labels:
    app: cc-demo
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
  volumes:
    - name: html
      configMap:
        # BUG: this ConfigMap has not been created yet
        name: web-content
