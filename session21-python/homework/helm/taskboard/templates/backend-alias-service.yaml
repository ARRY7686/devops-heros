# FIX: the frontend image's nginx.conf proxies /api/ to http://backend:8000 (the Docker
# Compose service name). Without a Service called "backend", nginx cannot resolve the
# upstream at startup and the frontend Pod crashes. This alias Service provides that name.
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels: {app: taskboard-backend}
spec:
  selector: {app: taskboard-backend}
  ports:
    - port: 8000
      targetPort: 8000
      name: http
